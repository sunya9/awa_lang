# awa はモノレポ（Cargo ワークスペース）。
#   crates/awa-core … コンパイラ＋ランタイム（ライブラリ。CLI と LSP が共有）
#   crates/awa-cli  … `awa` コマンド（インタプリタ実行・emit・build・REPL）
[workspace]
members = ["crates/awa-core", "crates/awa-cli", "crates/awa-lsp"]
resolver = "2"
# `cargo run` / `cargo build` を引数なしで叩いたとき既定で awa-cli（awa コマンド）を対象にする。
default-members = ["crates/awa-cli"]
